<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locum Tenens Recruiter Training Program</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:2rem 1rem 4rem}
.top-header{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
.top-header h1{font-size:22px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.top-header h1 i{color:#1D9E75}
.top-header p{font-size:13px;color:#666;margin-bottom:12px}
.pb-wrap{background:#e8e6de;border-radius:4px;height:7px}
.pb{background:#1D9E75;height:7px;border-radius:4px;transition:width 0.4s}
.pb-label{font-size:12px;color:#888;margin-top:5px}
.tab-bar{display:flex;gap:4px;background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{flex:1;min-width:88px;background:transparent;border:none;border-radius:8px;padding:8px 5px;cursor:pointer;font-size:11px;font-weight:500;color:#888;transition:all 0.15s;text-align:center;line-height:1.3}
.tab-btn:hover{background:#f5f5f0;color:#444}
.tab-btn.active{background:#E1F5EE;color:#0F6E56}
.tab-btn.done{color:#1D9E75}
.tab-btn .tn{font-size:10px;display:block;margin-bottom:2px;opacity:0.7}
.panel{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:1.5rem;margin-bottom:1rem}
.panel h2{font-size:19px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h2 i{color:#1D9E75}
.subtitle{font-size:13px;color:#888;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #f0ede6}
.section{margin-bottom:1.25rem}
.section h3{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.section h3 i{color:#1D9E75;font-size:16px}
.section p,.section li{font-size:14px;line-height:1.75;color:#555}
.section ul{padding-left:1.25rem;margin-top:6px}
.section li{margin-bottom:5px}
.kt{background:#E1F5EE;border:1px solid #9FE1CB;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;color:#333}
.kt strong{color:#0F6E56}
.ib{background:#f5f5f0;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:13px;color:#555}
.wb{background:#FAEEDA;border-left:3px solid #EF9F27;border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:13px;color:#633806}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.sc{background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:10px;text-align:center;font-size:12px}
.sc .sn{font-size:18px;font-weight:600;color:#1D9E75;margin-bottom:4px}
.sc .sl{color:#666;line-height:1.4}
.qsec{background:#f5f5f0;border:1px solid #e0dfd8;border-radius:14px;padding:1.25rem;margin-top:1.5rem}
.qsec h3{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.qsec h3 i{color:#1D9E75}
.qi{font-size:13px;color:#888;margin-bottom:1rem}
.qb{margin-bottom:1.25rem}
.qn{font-size:11px;color:#999;margin-bottom:5px}
.qt{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5;color:#222}
.ob{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e0dfd8;border-radius:8px;padding:9px 13px;margin-bottom:6px;cursor:pointer;font-size:13px;color:#333;transition:all 0.15s;line-height:1.4}
.ob:hover{background:#f5f5f0;border-color:#ccc}
.ob.sel{border-color:#1D9E75;background:#E1F5EE;color:#0F6E56}
.ob.cor{background:#E1F5EE;border-color:#1D9E75;color:#0F6E56;pointer-events:none}
.ob.wrg{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;pointer-events:none}
.ob.dis{pointer-events:none;opacity:0.75}
.fb{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:6px;line-height:1.5}
.fb.ok{background:#E1F5EE;color:#0F6E56}
.fb.bad{background:#FCEBEB;color:#791F1F}
.hidden{display:none}
.btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;color:#333;transition:all 0.15s;font-weight:500}
.btn:hover{background:#f5f5f0}
.btn.p{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn.p:hover{background:#0F6E56}
.btn:disabled{opacity:0.5;cursor:default}
.ar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:1.25rem}
.qres{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem;text-align:center;margin-top:1rem}
.qres .sc2{font-size:36px;font-weight:700;color:#1D9E75}
.qres .sl2{font-size:13px;color:#888;margin-top:4px}
.pbadge{display:inline-block;background:#E1F5EE;color:#0F6E56;border-radius:8px;padding:5px 16px;font-size:12px;font-weight:600;margin-top:8px}
.fbadge{display:inline-block;background:#FCEBEB;color:#791F1F;border-radius:8px;padding:5px 16px;font-size:12px;font-weight:600;margin-top:8px}
.stag{display:inline-block;background:#E1F5EE;color:#0F6E56;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;margin-bottom:8px}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:1rem;text-align:left}
.bdc{background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:10px 12px}
.bdc .bdl{font-size:11px;color:#888;margin-bottom:4px;line-height:1.3}
.bdc .bds{font-size:20px;font-weight:700}
.bds.g{color:#1D9E75}.bds.a{color:#BA7517}.bds.r{color:#E24B4A}
.cbox{border:2px solid #1D9E75;border-radius:12px;padding:1.5rem;margin-top:1.25rem;background:#fff;text-align:center}
.cbox h2{font-size:20px;font-weight:700;margin-bottom:6px}
.cbox .cn{font-size:22px;font-weight:700;color:#0F6E56;margin:10px 0}
.cbox p{font-size:13px;color:#888;line-height:1.7}
.fep{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:1.5rem;margin-bottom:1rem}
</style>
</head>

</div>

<div id="content"></div>
</div>

{h:"What is locum tenens?",i:"ti-info-circle",b:'<p>The term <em>locum tenens</em> is Latin meaning "to hold the place of." In healthcare, it refers to physicians, APPs, and other clinicians who temporarily fill staffing gaps at hospitals, clinics, and facilities.</p><div class="kt"><strong>Locum Tenens Provider:</strong> A licensed healthcare professional who works on a temporary or contract basis &mdash; filling in for vacationing staff, covering open positions, or supporting surges in patient volume.</div><p>The industry has grown into a multi-billion dollar sector, with over 50,000 providers working locum assignments in any given year across the U.S.</p>'},
