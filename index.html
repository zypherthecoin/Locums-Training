.btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;color:#333;transition:all 0.15s;font-weight:500}

.ar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:1.25rem}
.qres{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem;text-align:center;margin-top:1rem}

.pbadge{display:inline-block;background:#E1F5EE;color:#0F6E56;border-radius:8px;padding:5px 16px;font-size:12px;font-weight:600;margin-top:8px}
.fbadge{display:inline-block;background:#FCEBEB;color:#791F1F;border-radius:8px;padding:5px 16px;font-size:12px;font-weight:600;margin-top:8px}
.stag{display:inline-block;background:#E1F5EE;color:#0F6E56;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;margin-bottom:8px}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:1rem;text-align:left}
.bdc{background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:10px 12px}
.bdc .bdl{font-size:11px;color:#888;margin-bottom:4px;line-height:1.3}
.bdc .bds{font-size:20px;font-weight:700}
.bds.g{color:#1D9E75}.bds.a{color:#BA7517}.bds.r{color:#E24B4A}

.cbox .cn{font-size:22px;font-weight:700;color:#0F6E56;margin:10px 0}
.cbox p{font-size:13px;color:#888;line-height:1.7}
.fep{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:1.5rem;margin-bottom:1rem}

<body>
<div class="app">
<div class="top-header">
  <h1><i class="ti ti-school"></i> Locum Tenens Recruiter Training Program</h1>
  <p>Advanced curriculum for staffing agency professionals &mdash; 6 modules + final exam</p>
  <div class="pb-wrap"><div class="pb" id="mpb" style="width:0%"></div></div>
  <div class="pb-label" id="mpl">0 of 6 modules complete</div>
</div>
<div class="tab-bar" id="tabs"></div>
<div id="content"></div>
</div>
<script>
var M=[
{id:0,title:"Intro to Locum Tenens",icon:"ti-stethoscope",
sec:[
{h:"What is locum tenens?",i:"ti-info-circle",b:'<p>The term <em>locum tenens</em> is Latin meaning "to hold the place of." In healthcare, it refers to physicians, APPs, and other clinicians who temporarily fill staffing gaps at hospitals, clinics, and facilities.</p><div class="kt"><strong>Locum Tenens Provider:</strong> A licensed healthcare professional who works on a temporary or contract basis &mdash; filling in for vacationing staff, covering open positions, or supporting surges in patient volume.</div><p>The industry has grown into a multi-billion dollar sector, with over 50,000 providers working locum assignments in any given year across the U.S.</p>'},
{h:"Why facilities use locums",i:"ti-building-hospital",b:'<ul><li>Cover physician vacancies during permanent searches</li><li>Handle seasonal or unexpected patient volume surges</li><li>Provide rural or underserved area coverage</li><li>Trial candidates before making permanent offers</li><li>Reduce burnout on existing staff</li></ul><div class="ib">Rural and Critical Access Hospitals (CAHs) are among the most frequent users of locum providers &mdash; often relying on locums for 20-40% of their clinical coverage.</div>'},
{h:"Your role as a recruiter",i:"ti-users",b:'<p>As a locum tenens recruiter, you are the critical link between facilities in need and qualified providers. Core responsibilities:</p><ul><li>Building and managing a pipeline of credentialed providers</li><li>Understanding facility needs and matching the right provider</li><li>Coordinating licensing, credentialing, and travel logistics</li><li>Negotiating compensation and contract terms</li><li>Maintaining compliance with healthcare regulations</li></ul>'},
{h:"Key industry players",i:"ti-sitemap",b:'<div class="sgrid"><div class="sc"><div class="sn"><i class="ti ti-user-check" style="color:#1D9E75"></i></div><div class="sl"><strong>Provider</strong><br>The physician or APP</div></div><div class="sc"><div class="sn"><i class="ti ti-building"></i></div><div class="sl"><strong>Facility</strong><br>Hospital or clinic</div></div><div class="sc"><div class="sn"><i class="ti ti-briefcase"></i></div><div class="sl"><strong>Staffing Agency</strong><br>Bridges both sides</div></div><div class="sc"><div class="sn"><i class="ti ti-license"></i></div><div class="sl"><strong>State Board</strong><br>Issues licenses</div></div></div>'}
],
quiz:[
{q:"What does 'locum tenens' translate to in Latin?",o:["Traveling doctor","To hold the place of","Temporary license","Medical substitute"],a:1,e:"Locum tenens is Latin for 'to hold the place of,' reflecting the temporary, fill-in nature of the work."},
{q:"Which facility type most frequently relies on locum coverage?",o:["Urban academic medical centers","Specialty surgery centers","Rural and Critical Access Hospitals","Federal VA hospitals"],a:2,e:"Rural and Critical Access Hospitals frequently use locums due to difficulty attracting and retaining permanent staff."},
{q:"Which is NOT a core recruiter responsibility?",o:["Building a provider pipeline","Personally credentialing providers","Coordinating travel logistics","Negotiating compensation"],a:1,e:"Recruiters coordinate credentialing but do not perform it themselves."},
{q:"Approximately how many providers work locum assignments in the U.S. annually?",o:["5,000","50,000","200,000","500,000"],a:1,e:"Industry estimates put active locum providers in the U.S. at approximately 50,000 in any given year."}
]},
{id:1,title:"Provider Types & Specialties",icon:"ti-heart-rate-monitor",
sec:[
{h:"Physician specialties in high demand",i:"ti-stethoscope",b:'<div class="sgrid"><div class="sc"><div class="sn">&#127973;</div><div class="sl"><strong>Hospitalist</strong><br>Inpatient medicine</div></div><div class="sc"><div class="sn">&#129504;</div><div class="sl"><strong>Psychiatry</strong><br>Severe national shortage</div></div><div class="sc"><div class="sn">&#129690;</div><div class="sl"><strong>Emergency Med</strong><br>24/7 coverage critical</div></div><div class="sc"><div class="sn">&#128300;</div><div class="sl"><strong>Anesthesiology</strong><br>High-value specialty</div></div><div class="sc"><div class="sn">&#128118;</div><div class="sl"><strong>OB/GYN</strong><br>Rural hospitals dependent</div></div><div class="sc"><div class="sn">&#128138;</div><div class="sl"><strong>Primary Care</strong><br>FP/IM, community health</div></div></div>'},
{h:"Advanced Practice Providers (APPs)",i:"ti-user-shield",b:'<div class="kt"><strong>NP (Nurse Practitioner):</strong> Can diagnose, treat, and prescribe. 26 states allow Full Practice Authority (FPA) &mdash; no physician oversight required.</div><div class="kt"><strong>PA-C (Physician Assistant):</strong> Works under physician collaboration or supervision depending on state law. High demand in surgical and ED settings.</div><div class="kt"><strong>CRNA:</strong> Certified Registered Nurse Anesthetist &mdash; administers anesthesia. State oversight requirements vary.</div><div class="wb">Always confirm scope of practice rules in the specific assignment state before placing an APP.</div>'},
{h:"Understanding provider motivations",i:"ti-mood-happy",b:'<ul><li>Higher compensation than permanent positions</li><li>Geographic flexibility and travel opportunities</li><li>Escape from administrative burden of private practice</li><li>Transitional periods (retirement, relocation, career change)</li><li>Paying off medical school debt faster</li><li>Exploring different practice environments</li></ul>'}
],
quiz:[
{q:"Which specialty has the most severe national shortage in locum tenens demand?",o:["Dermatology","Psychiatry","Sports Medicine","Ophthalmology"],a:1,e:"Psychiatry faces one of the most critical provider shortages in the U.S., making locum psychiatrists exceptionally high in demand."},
{q:"What does Full Practice Authority (FPA) mean for an NP?",o:["They can perform surgery independently","They can diagnose, treat, and prescribe without physician oversight","They have a permanent license","They can work in any state without licensure"],a:1,e:"FPA allows NPs to practice independently without requiring physician collaboration agreements."},
{q:"A PA-C in a supervision-required state requires the recruiter to confirm:",o:["The PA has malpractice insurance","A collaborating physician is available and named","The PA is board certified","The facility is accredited"],a:1,e:"The PA must have a named supervising physician established in the agreement as required by the state's practice act."},
{q:"The most common reason physicians choose locum work is:",o:["Avoiding patient contact","Higher compensation than permanent roles","Free housing","Lack of board exam requirements"],a:1,e:"Higher compensation is consistently cited as the primary driver for providers choosing locum tenens."}
]},
{id:2,title:"Credentialing & Licensing",icon:"ti-license",
sec:[
{h:"Medical licensing fundamentals",i:"ti-id-badge",b:'<div class="kt"><strong>Initial Licensure:</strong> Applying for a medical license in a new state. Can take 60-120+ days depending on the state board.</div><div class="kt"><strong>License Verification:</strong> Confirming a license is active, unrestricted, and in good standing with the relevant state medical board.</div><div class="ib">The <strong>Interstate Medical Licensure Compact (IMLC)</strong> allows eligible physicians to obtain licenses in multiple member states more quickly &mdash; typically 30-45 days.</div>'},
{h:"The credentialing process",i:"ti-clipboard-check",b:'<div class="sgrid"><div class="sc"><div class="sn">1</div><div class="sl">Application submitted</div></div><div class="sc"><div class="sn">2</div><div class="sl">Primary source verification</div></div><div class="sc"><div class="sn">3</div><div class="sl">Background check &amp; NPDB</div></div><div class="sc"><div class="sn">4</div><div class="sl">Medical staff review</div></div><div class="sc"><div class="sn">5</div><div class="sl">Privileges granted</div></div></div><div class="wb">Credentialing takes 60-90 days. For urgent placements, ask about <strong>temporary privileges</strong>.</div>'},
{h:"Key documents to track",i:"ti-files",b:'<ul><li>State medical license(s) and expiration dates</li><li>DEA registration (federal and state-specific)</li><li>Board certification certificates</li><li>Medical school diploma and training verification</li><li>Malpractice insurance certificates (occurrence vs. claims-made)</li><li>ECFMG certificate (international medical graduates)</li><li>BLS/ACLS/ATLS certifications</li><li>National Provider Identifier (NPI)</li><li>NPDB query results</li></ul><div class="kt"><strong>NPDB:</strong> Federal database tracking malpractice payments, adverse licensure actions, and clinical privilege revocations.</div>'},
{h:"Malpractice insurance types",i:"ti-shield-check",b:'<div class="kt"><strong>Occurrence-based:</strong> Covers incidents during the policy period regardless of when the claim is filed. Most comprehensive and preferred by providers.</div><div class="kt"><strong>Claims-made:</strong> Only covers claims filed while the policy is active. Requires a <em>tail policy</em> when coverage ends.</div><div class="ib">Most staffing agencies provide malpractice coverage for their locum providers. Always clarify who provides coverage before an assignment begins.</div>'}
],
quiz:[
{q:"How long does initial state medical licensure typically take?",o:["1-2 weeks","60-120+ days","Exactly 30 days","It varies only by specialty"],a:1,e:"Initial state medical licensure typically takes 60-120+ days, making early planning critical."},
{q:"The IMLC allows eligible physicians to:",o:["Practice in any state without a license","Obtain multi-state licenses more quickly (~30-45 days)","Facilities to skip credentialing","APPs to practice independently"],a:1,e:"The IMLC streamlines multi-state licensing, reducing the process to approximately 30-45 days."},
{q:"Primary Source Verification (PSV) means:",o:["The recruiter reviews the CV","Verifying credentials with the original issuing institution","Using a third-party database","The provider self-certifies"],a:1,e:"PSV involves contacting the original institution directly, not relying on copies provided by the applicant."},
{q:"A provider's claims-made policy expired. What do they need?",o:["A new occurrence policy","Tail coverage for the past period","Re-credentialing at the facility","A DEA renewal"],a:1,e:"Claims-made policies require tail coverage to cover claims arising after the policy period for incidents that occurred during it."},
{q:"What does the NPDB contain?",o:["Provider tax records","Malpractice payments and adverse licensure actions","Licensing exam scores","Hospital billing histories"],a:1,e:"The NPDB tracks malpractice payment reports, adverse licensure actions, and clinical privilege revocations."}
]},
{id:3,title:"Contracts & Compensation",icon:"ti-file-dollar",
sec:[
{h:"How locum tenens compensation works",i:"ti-currency-dollar",b:'<div class="kt"><strong>Bill Rate:</strong> The rate the staffing agency charges the facility. Higher than the pay rate.</div><div class="kt"><strong>Pay Rate:</strong> The rate paid to the provider. Agency margin = Bill Rate minus Pay Rate minus overhead.</div><div class="ib">Typical agency margins range from 20-35% of the bill rate.</div><div class="sgrid"><div class="sc"><div class="sn">$</div><div class="sl"><strong>Hourly</strong><br>EM, hospitalist, urgent care</div></div><div class="sc"><div class="sn">$$</div><div class="sl"><strong>Daily</strong><br>Surgical specialties</div></div><div class="sc"><div class="sn">$$$</div><div class="sl"><strong>Per Diem</strong><br>Housing/travel added on top</div></div></div>'},
{h:"What is included in a locum package",i:"ti-package",b:'<ul><li>Travel reimbursement (flights, mileage, rental car)</li><li>Housing (provided or stipend)</li><li>Malpractice insurance coverage</li><li>Licensure and credentialing fee reimbursement</li><li>DEA registration reimbursement</li><li>CME allowance (less common)</li></ul><div class="wb">All reimbursements must be handled carefully for IRS compliance. W-2 vs. 1099 classification affects tax treatment.</div>'},
{h:"Key contract components",i:"ti-contract",b:'<div class="kt"><strong>Provider Agreement:</strong> Outlines pay rate, assignment details, cancellation policy, exclusivity clauses, and confidentiality.</div><div class="kt"><strong>Facility Agreement (MSA):</strong> Defines bill rates, liability, credentialing responsibilities, and termination terms.</div><ul style="margin-top:10px"><li><strong>Cancellation clause:</strong> Notice required and penalties for both sides</li><li><strong>Non-solicitation clause:</strong> Prevents direct hire without a conversion fee</li><li><strong>Conversion fee:</strong> Charged if a locum provider is hired permanently</li><li><strong>Scope of services</strong> and call requirements</li></ul>'},
{h:"W-2 vs. 1099 status",i:"ti-receipt-tax",b:'<div class="kt"><strong>W-2 Employee:</strong> The agency withholds taxes and pays employer FICA. More protection for the provider.</div><div class="kt"><strong>1099 Independent Contractor:</strong> Provider is responsible for self-employment taxes (15.3%). Often receives a higher gross rate.</div><div class="ib">Most major staffing agencies use W-2 arrangements to reduce IRS misclassification risk.</div>'}
],
quiz:[
{q:"What is the 'bill rate'?",o:["The rate paid to the provider","The rate charged to the facility by the agency","The provider travel stipend","The agency operating cost"],a:1,e:"The bill rate is what the agency charges the client facility, higher than the pay rate and covering the agency margin."},
{q:"What is a 'conversion fee'?",o:["A fee when a provider converts from W-2 to 1099","A penalty if a facility directly hires a locum provider","A fee for changing assignment states","A malpractice surcharge"],a:1,e:"A conversion fee is charged if the client facility permanently hires a locum provider placed through the agency."},
{q:"A 1099 contractor pays self-employment tax of approximately:",o:["7.65%","10%","15.3%","22%"],a:2,e:"Self-employment tax is 15.3%, covering both the employer and employee portions of FICA."},
{q:"A non-solicitation clause protects:",o:["The provider from competitors","The agency from the facility hiring the provider directly without a fee","The facility from malpractice claims","The provider from excess hours"],a:1,e:"A non-solicitation clause prevents the facility from directly employing the placed provider without paying the agency conversion fee."}
]},
{id:4,title:"Compliance & Risk Management",icon:"ti-shield",
sec:[
{h:"Healthcare-specific compliance requirements",i:"ti-clipboard-list",b:'<ul><li><strong>OIG Exclusion List:</strong> Federal list of excluded individuals from Medicare/Medicaid. Must be checked before every placement.</li><li><strong>SAM.gov Exclusions:</strong> Bars providers from federal contracts. Must also be checked.</li><li><strong>HIPAA Compliance:</strong> Providers must be trained on patient privacy before starting.</li><li><strong>Joint Commission Standards:</strong> Locums must meet the same credentialing standards as permanent staff at accredited facilities.</li></ul><div class="wb">Placing an OIG-excluded provider can result in significant civil monetary penalties. Check before every assignment.</div>'},
{h:"Background check requirements",i:"ti-user-search",b:'<div class="kt"><strong>Criminal Background Check:</strong> Required by most facilities &mdash; typically a 7-year lookback.</div><div class="kt"><strong>Drug Screening:</strong> Most healthcare facilities require pre-assignment drug testing.</div><div class="kt"><strong>Sex Offender Registry:</strong> Must be checked in many states as part of the hiring process.</div><div class="ib">Know the specific background check laws in each state where you place providers.</div>'},
{h:"Risk scenarios and how to handle them",i:"ti-alert-circle",b:'<ul><li><strong>License with a restriction:</strong> Always read restriction details &mdash; never assume a license is fully unrestricted.</li><li><strong>Malpractice history:</strong> Multiple paid claims may be disqualifying. Disclose proactively to the facility.</li><li><strong>Gap in practice:</strong> A provider who has not practiced in 12+ months may need a competency evaluation.</li><li><strong>Mid-assignment termination:</strong> Know your contract termination clauses and have a contingency plan.</li></ul>'},
{h:"Facility due diligence",i:"ti-building-community",b:'<ul><li>Confirm the facility is licensed and appropriately accredited</li><li>Review CMS Conditions of Participation compliance history</li><li>Confirm adequate supervision for APPs as required by state law</li><li>Verify the facility has workers compensation coverage for locum providers</li></ul><div class="ib">Always obtain a signed Master Service Agreement (MSA) before committing any provider to an assignment.</div>'}
],
quiz:[
{q:"What is the OIG Exclusion List?",o:["Facilities that overcharge Medicare","Federal list of providers excluded from Medicare/Medicaid","A state-level malpractice database","A list of expired medical licenses"],a:1,e:"The OIG Exclusion List identifies individuals excluded from federal healthcare programs. Placing an excluded provider exposes both parties to significant penalties."},
{q:"How often should OIG exclusion checks be performed?",o:["Once at initial onboarding","Before every new assignment","Annually","Only when the facility requests it"],a:1,e:"Best practice is to check before every new assignment, with monthly monitoring for active providers."},
{q:"A provider license has a restriction noted. The recruiter should:",o:["Proceed without mentioning it","Disclose the restriction to the facility before proceeding","Treat it as unrestricted unless asked","Disqualify the provider permanently"],a:1,e:"Full, proactive disclosure to the facility is required so they can assess whether they can accommodate the restriction."},
{q:"A gap-in-practice risk applies when a provider:",o:["Works in multiple states","Has not practiced for 12+ months","Has no malpractice history","Works at a low-volume facility"],a:1,e:"A 12+ month gap raises competency questions. Many facilities require a proctoring period or formal competency assessment."}
]},
{id:5,title:"Client & Candidate Relations",icon:"ti-handshake",
sec:[
{h:"Building your provider pipeline",i:"ti-users-group",b:'<ul><li><strong>Proactive outreach:</strong> Use LinkedIn, medical society directories, and referrals &mdash; not just job boards.</li><li><strong>Specialty targeting:</strong> Focus on 2-3 specialties to build deep expertise and a strong referral network.</li><li><strong>Warm pipeline:</strong> Maintain regular contact with providers between assignments.</li><li><strong>Candidate experience:</strong> Providers talk to each other &mdash; a seamless experience drives referrals and repeat business.</li></ul>'},
{h:"The facility relationship lifecycle",i:"ti-building",b:'<div class="sgrid"><div class="sc"><div class="sn">1</div><div class="sl"><strong>Prospecting</strong></div></div><div class="sc"><div class="sn">2</div><div class="sl"><strong>Discovery</strong></div></div><div class="sc"><div class="sn">3</div><div class="sl"><strong>Proposal</strong></div></div><div class="sc"><div class="sn">4</div><div class="sl"><strong>Placement</strong></div></div><div class="sc"><div class="sn">5</div><div class="sl"><strong>Retention</strong></div></div><div class="sc"><div class="sn">6</div><div class="sl"><strong>Expansion</strong></div></div></div>'},
{h:"Handling objections",i:"ti-message-circle",b:'<div class="kt"><strong>"Your rates are too high":</strong> Refocus on value &mdash; cost of unfilled shifts, patient access disruption, and permanent search timelines.</div><div class="kt"><strong>"We have had bad experiences with locums":</strong> Ask about the specific issues and offer a short trial assignment.</div><div class="kt"><strong>"The provider cancelled last minute":</strong> Have a backup candidate ready. Communicate immediately and provide alternatives within hours.</div>'},

{m:"Intro to Locum Tenens",q:"Approximately how many providers work locum assignments in the U.S. annually?",o:["5,000","20,000","50,000","150,000"],a:2,e:"Industry estimates place the number at approximately 50,000 annually."},
{m:"Intro to Locum Tenens",q:"Facilities sometimes use locum tenens to:",o:["Avoid credentialing requirements","Trial a provider before making a permanent offer","Bypass state licensing requirements","Reduce malpractice costs"],a:1,e:"Facilities frequently use locum arrangements as a trial before extending a permanent employment offer."},

{m:"Contracts & Compensation",q:"A standard locum tenens compensation package typically includes:",o:["Agency equity","Travel reimbursement, housing, and malpractice coverage","Signing bonus and profit sharing","Paid time off and health insurance"],a:1,e:"Standard locum packages include travel reimbursement, housing or a housing stipend, and malpractice insurance."},

{m:"Client & Candidate Relations",q:"The most effective strategy for a warm provider pipeline is:",o:["Posting jobs and waiting","Regular personal check-ins and sharing relevant opportunities between assignments","Monthly mass email blasts","Always offering the highest pay rate"],a:1,e:"Personal, consistent outreach between assignments builds genuine trust and keeps providers engaged with your agency."}

var done={},qs={},cv='module-0',ma={},ms={},ea={},es=false;
function nc(){return Object.keys(done).filter(function(k){return done[k];}).length;}
function upd(){
  var n=nc(),p=Math.round((n/M.length)*100);
  document.getElementById('mpb').style.width=p+'%';
  document.getElementById('mpl').textContent=n+' of '+M.length+' modules complete';
  rt();
}
function rt(){
  var h='';
  for(var i=0;i<M.length;i++){
    var cls='tab-btn'+(cv==='module-'+i?' active':'')+(done[i]?' done':'');
    var chk=done[i]?'&#10003; ':'';
    h+='<button class="'+cls+'" onclick="lm('+i+')"><span class="tn">Module '+(i+1)+'</span>'+chk+M[i].title+'</button>';
  }
  var ec='tab-btn'+(cv==='exam'?' active':'');
  h+='<button class="'+ec+'" onclick="le()"><span class="tn">Final</span>&#127942; Final Exam</button>';
  document.getElementById('tabs').innerHTML=h;
}
function lm(idx){
  cv='module-'+idx;
  if(!ma[idx]) ma[idx]={};
  if(ms[idx]===undefined) ms[idx]=false;
  var m=M[idx],sh='';
  for(var s=0;s<m.sec.length;s++) sh+='<div class="section"><h3><i class="ti '+m.sec[s].i+'"></i> '+m.sec[s].h+'</h3>'+m.sec[s].b+'</div>';
  var qh=bmq(m,idx);
  document.getElementById('content').innerHTML=
    '<div class="panel"><h2><i class="ti '+m.icon+'"></i> '+m.title+'</h2><p class="subtitle">Module '+(idx+1)+' of '+M.length+' &mdash; Read the material, then complete the assessment below.</p>'+sh+'</div>'+
    '<div class="qsec" id="mq-'+idx+'"><h3><i class="ti ti-list-check"></i> Module '+(idx+1)+' Assessment</h3><p class="qi">Answer all questions and submit. Need 75% or higher to pass.</p>'+qh+
    '<div class="ar"><button class="btn p" onclick="smq('+idx+')" id="sb-'+idx+'">Submit answers</button>'+
    (idx>0?'<button class="btn" onclick="lm('+(idx-1)+')">&#8592; Previous</button>':'')+
    (idx<M.length-1?'<button class="btn" onclick="lm('+(idx+1)+')">Next &#8594;</button>':'')+
    '<button class="btn" onclick="le()">&#127942; Final Exam</button></div>'+
    '<div id="mr-'+idx+'"></div></div>';
  if(ms[idx]) rsm(idx);
  rt();window.scrollTo({top:0,behavior:'smooth'});
}
function bmq(m,idx){
  var h='';
  for(var qi=0;qi<m.quiz.length;qi++){
    var q=m.quiz[qi];
    h+='<div class="qb"><div class="qn">Question '+(qi+1)+' of '+m.quiz.length+'</div><div class="qt">'+q.q+'</div>';
    for(var oi=0;oi<q.o.length;oi++) h+='<button class="ob" id="mo-'+idx+'-'+qi+'-'+oi+'" onclick="smo('+idx+','+qi+','+oi+')">'+String.fromCharCode(65+oi)+'. '+q.o[oi]+'</button>';
    h+='<div id="mf-'+idx+'-'+qi+'" class="hidden"></div></div>';
  }
  return h;
}
function rsm(idx){
  var m=M[idx];
  for(var qi=0;qi<m.quiz.length;qi++){
    var q=m.quiz[qi],ch=ma[idx][qi];
    for(var oi=0;oi<q.o.length;oi++){
      var b=document.getElementById('mo-'+idx+'-'+qi+'-'+oi);
      if(!b) continue;
      b.classList.add('dis');
      if(oi===q.a) b.classList.add('cor');
      else if(oi===ch&&oi!==q.a) b.classList.add('wrg');
    }
    var fb=document.getElementById('mf-'+idx+'-'+qi);
    if(fb){var ok=ch===q.a;fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?'Correct: ':'Incorrect: ')+q.e;}
  }
  var sb=document.getElementById('sb-'+idx);if(sb) sb.disabled=true;
  var p=qs[idx]||0,psd=p>=75,re=document.getElementById('mr-'+idx);
  if(re) re.innerHTML='<div class="qres"><div class="sc2">'+p+'%</div><div class="sl2">Previously submitted</div><div class="'+(psd?'pbadge':'fbadge')+'">'+(psd?'&#10003; Module passed':'&#10007; Not passed')+'</div>'+(!psd?'<br><br><button class="btn" onclick="rtm('+idx+')">Retake</button>':'')+'</div>';
}
function smo(idx,qi,oi){
  if(ms[idx]) return;
  ma[idx][qi]=oi;
  var m=M[idx];
  for(var j=0;j<m.quiz[qi].o.length;j++){var b=document.getElementById('mo-'+idx+'-'+qi+'-'+j);if(b){b.classList.remove('sel');if(j===oi)b.classList.add('sel');}}
}
function smq(idx){
  var m=M[idx];
  if(Object.keys(ma[idx]).length<m.quiz.length){alert('Please answer all questions first.');return;}
  ms[idx]=true;document.getElementById('sb-'+idx).disabled=true;
  var cor=0;
  for(var qi=0;qi<m.quiz.length;qi++){
    var q=m.quiz[qi],ch=ma[idx][qi],ok=ch===q.a;
    if(ok) cor++;
    for(var oi=0;oi<q.o.length;oi++){var b=document.getElementById('mo-'+idx+'-'+qi+'-'+oi);if(!b)continue;b.classList.remove('sel');b.classList.add('dis');if(oi===q.a)b.classList.add('cor');else if(oi===ch&&!ok)b.classList.add('wrg');}
    var fb=document.getElementById('mf-'+idx+'-'+qi);
    if(fb){fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?'Correct: ':'Incorrect: ')+q.e;}
  }
  var p=Math.round((cor/m.quiz.length)*100),psd=p>=75;
  qs[idx]=p;if(psd) done[idx]=true;upd();
  var re=document.getElementById('mr-'+idx);
  re.innerHTML='<div class="qres"><div class="sc2">'+p+'%</div><div class="sl2">'+cor+' of '+m.quiz.length+' correct</div><div class="'+(psd?'pbadge':'fbadge')+'">'+(psd?'&#10003; Module passed':'&#10007; Review and retake')+'</div>'+
    (psd&&idx<M.length-1?'<br><br><button class="btn p" onclick="lm('+(idx+1)+')">Continue to Module '+(idx+2)+' &#8594;</button>':'')+
    (psd&&idx===M.length-1?'<br><br><button class="btn p" onclick="le()">&#127942; Take the Final Exam</button>':'')+
    (!psd?'<br><br><button class="btn" onclick="rtm('+idx+')">Retake</button>':'')+
    '</div>';
}
function rtm(idx){ma[idx]={};ms[idx]=false;done[idx]=false;upd();lm(idx);}
function le(){
  cv='exam';rt();
  var qh='';
  for(var qi=0;qi<FQ.length;qi++){
    var q=FQ[qi],sep=qi<FQ.length-1?'border-bottom:1px solid #f0ede6;padding-bottom:1.25rem;margin-bottom:1.25rem':'';
    qh+='<div class="qb" style="'+sep+'"><div class="stag">'+q.m+'</div><div class="qn">Question '+(qi+1)+' of '+FQ.length+'</div><div class="qt">'+q.q+'</div>';
    for(var oi=0;oi<q.o.length;oi++) qh+='<button class="ob" id="eo-'+qi+'-'+oi+'" onclick="seo('+qi+','+oi+')">'+String.fromCharCode(65+oi)+'. '+q.o[oi]+'</button>';
    qh+='<div id="ef-'+qi+'" class="hidden"></div></div>';
  }
  document.getElementById('content').innerHTML=
    '<div class="top-header" style="margin-bottom:1rem">'+
    '<h1><i class="ti ti-award" style="color:#1D9E75"></i> Final Comprehensive Exam</h1>'+
    '<p>Covers all 6 modules &mdash; pass with 80% or higher to earn your certification</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
    '<span style="background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:4px 10px;font-size:12px"><strong>30 questions</strong></span>'+
    '<span style="background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:4px 10px;font-size:12px"><strong>6 modules</strong></span>'+
    '<span style="background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:4px 10px;font-size:12px"><strong>80% to pass</strong></span>'+
    '<span style="background:#f5f5f0;border:1px solid #e0dfd8;border-radius:8px;padding:4px 10px;font-size:12px"><span id="eac">0</span>/30 answered</span></div>'+
    '<div class="pb-wrap" style="margin-top:10px"><div class="pb" id="epb" style="width:0%"></div></div></div>'+
    '<div class="fep">'+qh+
    '<div class="ar"><button class="btn p" id="esb" onclick="sub()">Submit final exam</button>'+
    '<span style="font-size:12px;color:#888">Answer all 30 questions before submitting</span></div></div>'+
    '<div id="er"></div>';
  if(es) rse();
  window.scrollTo({top:0,behavior:'smooth'});
}
function seo(qi,oi){
  if(es) return;ea[qi]=oi;
  var q=FQ[qi];
  for(var j=0;j<q.o.length;j++){var b=document.getElementById('eo-'+qi+'-'+j);if(b){b.classList.remove('sel');if(j===oi)b.classList.add('sel');}}
  var n=Object.keys(ea).length,ep=document.getElementById('epb'),ec=document.getElementById('eac');
  if(ep) ep.style.width=Math.round((n/30)*100)+'%';if(ec) ec.textContent=n;
}
function rse(){
  for(var qi=0;qi<FQ.length;qi++){if(ea[qi]!==undefined){var b=document.getElementById('eo-'+qi+'-'+ea[qi]);if(b)b.classList.add('sel');}}
}
function sub(){
  if(Object.keys(ea).length<FQ.length){alert('Please answer all 30 questions before submitting.');return;}
  es=true;document.getElementById('esb').disabled=true;
  var cor=0,bm={};
  for(var qi=0;qi<FQ.length;qi++){
    var q=FQ[qi];if(!bm[q.m])bm[q.m]={c:0,t:0};bm[q.m].t++;
    var ch=ea[qi],ok=ch===q.a;if(ok){cor++;bm[q.m].c++;}
    for(var oi=0;oi<q.o.length;oi++){var b=document.getElementById('eo-'+qi+'-'+oi);if(!b)continue;b.classList.remove('sel');b.classList.add('dis');if(oi===q.a)b.classList.add('cor');else if(oi===ch&&!ok)b.classList.add('wrg');}
    var fb=document.getElementById('ef-'+qi);
    if(fb){fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?'Correct: ':'Incorrect: ')+q.e;}
  }
  var p=Math.round((cor/FQ.length)*100),psd=p>=80,today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),bd='';
  var mk=Object.keys(bm);
  for(var mi=0;mi<mk.length;mi++){var d=bm[mk[mi]],s=Math.round((d.c/d.t)*100),cls=s>=80?'g':s>=60?'a':'r';bd+='<div class="bdc"><div class="bdl">'+mk[mi]+'</div><div class="bds '+cls+'">'+s+'%</div><div style="font-size:11px;color:#888">'+d.c+'/'+d.t+'</div></div>';}
  var cert=psd?'<div class="cbox"><p style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Certificate of Completion</p><h2>Locum Tenens Recruiter Training Program</h2><div class="cn">Final Exam &mdash; Passed</div><p>'+today+' &nbsp;&middot;&nbsp; Score: '+p+'% &nbsp;&middot;&nbsp; '+cor+' of 30 correct</p><p style="margin-top:6px;font-size:12px;color:#aaa">Locums Staffing Academy &middot; Advanced Curriculum</p></div>':'';
  document.getElementById('er').innerHTML='<div class="qres" style="margin-top:1rem"><div class="sc2" style="color:'+(psd?'#1D9E75':'#E24B4A')+'">'+p+'%</div><div class="sl2">'+cor+' of 30 correct</div><div class="'+(psd?'pbadge':'fbadge')+'">'+(psd?'&#10003; Passed &mdash; certification earned':'&#10007; Not passed &mdash; 80% required')+'</div><div class="bdgrid">'+bd+'</div>'+cert+(!psd?'<div style="margin-top:1rem"><button class="btn p" onclick="rte()">Retake exam</button></div>':'')+'</div>';
  document.getElementById('er').scrollIntoView({behavior:'smooth',block:'start'});
}
function rte(){ea={};es=false;le();}
lm(0);upd();
</script>
